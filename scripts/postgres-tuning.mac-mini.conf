# PostgreSQL tuning for local testing on a Mac Mini (M4, 16GB unified memory,
# ~7.75GB actually granted to the Docker Desktop VM). Sized to fit the whole
# atproto-core stack (postgres+redis+pds+bsky+dataplane+bsync+ozone+seaweedfs)
# in that budget alongside the container's own `mem_limit`/`deploy.resources`
# cap below — NOT for production. See postgres-tuning.conf for the
# 128GB-box original this was derived from.

# Connections
max_connections = 100
superuser_reserved_connections = 5

# Memory (must stay under the container's memory limit and shm_size)
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_buffers = 8MB

# WAL / Checkpointing
checkpoint_completion_target = 0.9
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_timeout = 10min

# Query planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# Autovacuum
autovacuum_max_workers = 2
autovacuum_naptime = 10s
