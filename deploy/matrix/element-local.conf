server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /version { add_header Cache-Control "no-cache"; }
    location /i18n/ { add_header Cache-Control "no-cache"; }
    location /config {
        root /tmp/element-web-config;
        add_header Cache-Control "no-cache";
    }
    location /modules { alias /modules; }

    # MAS owns legacy login/logout/refresh when Synapse delegates auth.
    location ~ ^/_matrix/client/(v1|v3|r0)/(login|logout|refresh)(/|$) {
        proxy_pass http://mas:8080;
    }
    location /_matrix/ {
        proxy_pass http://synapse:8008;
    }
}
