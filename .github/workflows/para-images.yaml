# Builds and publishes the PARA service images to GHCR.
#
# para-platform deploys these by tag (WATZAPPA_VERSION), so a server pulls a
# finished image instead of compiling the monorepo. Tags per image:
#   sha-<full commit>   every push to main (what deploys pin)
#   main                the latest main (never pin this in production)
#   X.Y.Z, X.Y          on a vX.Y.Z tag
#
# The upstream build-and-push-* workflows only run in bluesky-social/atproto
# and publish under a single image name, so this fork has its own.
name: para-images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'services/**'
      - '.github/workflows/para-images.yaml'
  workflow_dispatch:

concurrency:
  group: para-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # dataplane runs from the bsky image.
        service: [pds, bsky, bsync, ozone, matrix-bridge, para-idp]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/watzappa-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          # Pull requests only prove the image builds, on one platform.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
