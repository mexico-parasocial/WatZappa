---
# Docker Engine from Docker's own apt repository.

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add the Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  # Replaces the `apt_key` module, which is deprecated and writes to the
  # global trusted keyring — any key there can sign for any repository.

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/ubuntu"
    suites: "{{ ansible_lsb.codename | default(ansible_distribution_release) }}"
    components: [stable]
    architectures: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    enabled: true
  register: docker_repo
  # deb822_repository, not apt_repository: the latter is deprecated and is
  # removed in ansible-core 2.25. It needs python3-debian on the target, which
  # the common role installs.
  #
  # The architecture was hardcoded to amd64. On an arm64 host that produces a
  # repo with no matching packages and an unhelpful "Unable to locate package
  # docker-ce".

- name: Refresh apt after adding the Docker repository  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo is changed
  # Deliberately not a handler: the cache has to be refreshed BEFORE the
  # install task below, and handlers do not run until the end of the play.

- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  vars:
    docker_packages: >-
      {{
        ['docker-ce', 'docker-ce-cli', 'containerd.io',
         'docker-buildx-plugin', 'docker-compose-plugin']
        | map('regex_replace', '$', '=' ~ docker_apt_version)
        | list
        if docker_apt_version | length > 0
        else ['docker-ce', 'docker-ce-cli', 'containerd.io',
              'docker-buildx-plugin', 'docker-compose-plugin']
      }}
  # The old tree declared docker_version and never referenced it, so it always
  # installed latest while the variable suggested otherwise. Now the pin is
  # honoured when set and the empty default means "current stable", stated.

- name: Add the remote user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: ansible_user != 'root'

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

- name: Configure Docker log rotation
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {"max-size": "50m", "max-file": "5"}
      }
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker
  # Without this, Synapse and the AppView fill the disk with unrotated JSON
  # logs. On a single-host deployment that takes the database down with it.

- name: Verify the Compose plugin is present
  ansible.builtin.command: docker compose version
  changed_when: false
  # Every deploy task in this tree shells out to `docker compose`. Fail here,
  # with a clear task name, rather than inside a deploy step later.
