[defaults]
inventory = inventory/production.yml
remote_user = root
private_key_file = ~/.ssh/para_prod
retry_files_enabled = False
forks = 10
# Roles resolve relative to this file, not the cwd of whoever runs it.
roles_path = roles
# Human-readable task output; the default callback hides which host failed.
stdout_callback = yaml
# Facts are cached so a re-run of deploy.yml does not re-gather on every play.
fact_caching = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 3600

# Host keys ARE checked. The previous value (False) silently accepted any key
# presented on the target IP, which defeats the point of SSH on a box that
# holds the homeserver signing key. Accept the key once, on first connect:
#   ssh-keyscan -H <host> >> ~/.ssh/known_hosts
host_key_checking = True

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
