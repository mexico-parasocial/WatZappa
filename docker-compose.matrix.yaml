# PARA Matrix Homeserver Stack
# Add this to your infrastructure for community deliberation via Matrix.
#
# Two options are provided below:
#   A) Synapse  — mature, full-featured, battle-tested (RECOMMENDED)
#   B) Continuwuity — lightweight, Rust-based, minimal resource use
#
# Your 5950X + 128GB RAM can run either without any stress.
# Synapse uses ~4-8 GB RAM. Continuwuity uses < 1 GB RAM.
#
# Quick start:
#   1. Choose your server below (uncomment one block, comment the other).
#   2. Set MATRIX_SERVER_NAME and MATRIX_DOMAIN in your .env.
#   3. Run: ./WhatZatppa/deploy/matrix/setup.sh
#   4. Run: docker compose -f WhatZatppa/docker-compose.matrix.yaml up -d

services:
  # ═════════════════════════════════════════════════════════════════════════════
  # OPTION A: Synapse (Recommended for production)
  # ═════════════════════════════════════════════════════════════════════════════
  synapse:
    image: matrixdotorg/synapse:v1.134.0
    container_name: para-matrix-synapse
    restart: unless-stopped
    # Share the existing Postgres or use a dedicated one.
    # If you use the existing para-postgres, create the DB first:
    #   CREATE DATABASE matrix OWNER pg;
    depends_on:
      synapse-db:
        condition: service_started
      synapse-init:
        condition: service_completed_successfully
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME:-matrix.para.social}
      SYNAPSE_REPORT_STATS: 'no'
      # A directory, not a file: Synapse merges every *.yaml inside it in
      # lexicographic order, which is how deploy/matrix/hardening.yaml lands on
      # top of the generated homeserver.yaml. Pointing this at /data instead
      # would silently run an unhardened auto-generated config.
      SYNAPSE_CONFIG_PATH: /config
      SYNAPSE_DATA_DIR: /data
      SYNAPSE_DB_HOST: synapse-db
      SYNAPSE_DB_NAME: ${MATRIX_DB_NAME:-matrix}
      SYNAPSE_DB_USER: ${POSTGRES_USER:-pg}
      SYNAPSE_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SYNAPSE_DB_PORT: 5432
      SYNAPSE_ENABLE_REGISTRATION: 'no' # Keep closed; invite-only via admin
      SYNAPSE_LOG_LEVEL: INFO
    volumes:
      - synapse_data:/data
      # Generated by deploy/matrix/setup.sh; holds the signing key and secrets,
      # so it is gitignored.
      #
      # NOT :ro — Docker has to create the mountpoint for the overlay file
      # below inside this directory, which fails on a read-only mount. Synapse
      # never writes here; the overlay itself is mounted read-only.
      - ./deploy/matrix/synapse:/config
      # Tracked hardening overlay, mounted so it sorts after homeserver.yaml.
      - ./deploy/matrix/hardening.yaml:/config/zz-para-hardening.yaml:ro
    ports:
      - '127.0.0.1:8008:8008'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8008/health']
      interval: 15s
      timeout: 5s
      retries: 5

  # Prepares the data volume before Synapse starts. Required because the
  # image only chowns SYNAPSE_DATA_DIR when it generates its own config; with
  # an explicit SYNAPSE_CONFIG_PATH (which we need, to load the hardening
  # overlay) it assumes permissions are already handled, and Synapse — running
  # as uid 991 — cannot create /data/media_store in a root-owned volume.
  synapse-init:
    image: alpine:3
    container_name: para-matrix-init
    command: ["sh", "-c", "mkdir -p /data/media_store && chown -R 991:991 /data"]
    volumes:
      - synapse_data:/data
    restart: 'no'

  synapse-db:
    image: postgres:14.4-alpine
    container_name: para-matrix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${MATRIX_DB_NAME:-matrix}
      # Synapse REFUSES to start against any collation other than 'C'. This is
      # only applied at initdb time, so a volume created without it must be
      # destroyed and recreated — changing it later has no effect.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C --lc-ctype=C'
    volumes:
      - matrix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pg}']
      interval: 5s
      timeout: 5s
      retries: 5

  # ═════════════════════════════════════════════════════════════════════════════
  # OPTION B: Continuwuity (Ultra-lightweight alternative)
  # Uncomment the block below and comment out the Synapse block above to use.
  # ═════════════════════════════════════════════════════════════════════════════
  # continuwuity:
  #   image: ghcr.io/continuwuity/continuwuity:v0.5.0
  #   container_name: para-matrix-continuwuity
  #   restart: unless-stopped
  #   volumes:
  #     - continuwuity_data:/var/lib/continuwuity
  #   ports:
  #     - "6167:6167"
  #     - "127.0.0.1:8008:8008"   # Client API behind reverse proxy
  #   environment:
  #     CONTINUWUITY_SERVER_NAME: ${MATRIX_SERVER_NAME:-matrix.para.social}
  #     CONTINUWUITY_ALLOW_FEDERATION: "false"
  #     CONTINUWUITY_ALLOW_REGISTRATION: "false"
  #     CONTINUWUITY_LOG_LEVEL: info

  # ═════════════════════════════════════════════════════════════════════════════
  # para-idp — proves the user holds a PARA identity key (CD-M4)
  # ═════════════════════════════════════════════════════════════════════════════
  para-idp:
    build:
      context: .
      dockerfile: ./services/para-idp/Dockerfile
    container_name: para-idp
    restart: unless-stopped
    # Credentials generated by deploy/matrix/setup-mas.sh, so MAS and para-idp
    # cannot disagree about the client secret.
    env_file:
      - ./deploy/matrix/mas/para-idp.env
    environment:
      PORT: 8090
      PARA_IDP_APP_SCHEME: ${PARA_APP_SCHEME:-para}
      PARA_IDP_LOG_LEVEL: ${BRIDGE_LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:8090:8090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8090/healthz']
      interval: 15s
      timeout: 5s
      retries: 5

  # ═════════════════════════════════════════════════════════════════════════════
  # Matrix Authentication Service — owns logins; Synapse delegates via MSC3861
  # ═════════════════════════════════════════════════════════════════════════════
  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:0.20.0
    container_name: para-matrix-mas
    restart: unless-stopped
    depends_on:
      mas-db:
        condition: service_healthy
      para-idp:
        condition: service_started
    command: ['server', '--config', '/config/config.yaml']
    volumes:
      - ./deploy/matrix/mas:/config
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8081/health']
      interval: 15s
      timeout: 5s
      retries: 5

  mas-db:
    image: postgres:16-alpine
    container_name: para-matrix-mas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: mas
    volumes:
      - mas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pg}']
      interval: 5s
      timeout: 5s
      retries: 5

  # ═════════════════════════════════════════════════════════════════════════════
  # Element Web — client UI (works with Synapse OR Continuwuity)
  # ═════════════════════════════════════════════════════════════════════════════
  element-web:
    image: vectorim/element-web:v1.12.18
    container_name: para-matrix-element
    restart: unless-stopped
    volumes:
      - ./deploy/matrix/element-config.json:/app/config.json:ro
    ports:
      - '127.0.0.1:8082:80'  # 8080 belongs to MAS
    depends_on:
      - synapse

  # ═════════════════════════════════════════════════════════════════════════════
  # Matrix↔PARA Community Bridge
  # ═════════════════════════════════════════════════════════════════════════════
  matrix-bridge:
    build:
      context: .
      dockerfile: ./services/matrix-bridge/Dockerfile
    container_name: para-matrix-bridge
    restart: unless-stopped
    environment:
      PDS_FIREHOSE_URL: ${PDS_FIREHOSE_URL:-wss://pds.para.social/xrpc/com.atproto.sync.subscribeRepos}
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:-http://synapse:8008}
      MATRIX_ADMIN_TOKEN: ${MATRIX_ADMIN_TOKEN}
      MATRIX_ENABLE_ENCRYPTION: ${MATRIX_ENABLE_ENCRYPTION:-false}
      M8_BASE_URL: ${M8_BASE_URL:-http://host.docker.internal:8787/v1}
      BRIDGE_DB_PATH: /data/bridge.db
      BRIDGE_LOG_LEVEL: ${BRIDGE_LOG_LEVEL:-info}
      PORT: 3001
    volumes:
      - bridge_data:/data
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      synapse:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3001/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  synapse_data:
  matrix_postgres_data:
  mas_postgres_data:
  bridge_data:
  # continuwuity_data:
